# test file for haproxy
---
- name: HAProxy managed entirely by Ansible
  hosts: localhost
  connection: local
  become: true
  roles:
    - ../../
  vars:
    # global parameters
    haproxy_global_raw_options:
      - cpu-map 1/all 0-3
      - server-state-file /tmp/haproxy.state

    # default section
    haproxy_defaults_raw_options:
      - load-server-state-from-file global

    # front-end section
    haproxy_frontend:
      - name: http
        bind:
          - listen: '0.0.0.0:80'
        mode: http
        default_backend: webservers

    # back-end section
    haproxy_backend:
      - name: webservers
        mode: http
        balance: roundrobin
        option:
          - forwardfor
          - 'httpchk HEAD / HTTP/1.1\r\nHost:localhost'
        server: []

    # user-lists section
    haproxy_userlists:
      - name: test_userlist
        users:
          - name: testuser1
            # secrete
            password: $6$gLMr0TwOYURPhpXh$onP.5aHZGPE3xufyF8U0/wEKHMz71ECFBx4.uiO7t2ypgyvXS6MNFKHTo16qLttYJYObb0WbXyDmoNRsO4jtq.
            groups:
              - test_grp1
              - test_grp2
          - name: testuser2
            insecure_password: secrete
            groups:
              - test_grp2

    # ACL files (written to {{ _haproxy_acls_dir }}/<name>)
    haproxy_acls:
      - name: ported-paths.list
        ips:
          - ip: ^/users/add_player$
            comment: player signup
          - ip: ^/users/view.*$
      - name: api.map
        ips:
          - ip: v1.0 be_alpha
          - ip: v1.1 be_bravo
          - ip: v2.5 be_charlie
          - ip: v2.2 be_alpha
          - ip: v1.1 be_delta

- name: HAProxy bootstrapped for dataplaneapi
  hosts: localhost
  connection: local
  become: true
  roles:
    - ../../
  vars:
    haproxy_dataplaneapi_enabled: true
    dataplaneapi_haproxy_password: testpassword

    # Anything below the global/userlist sections is left to dataplaneapi, so only
    # a userlist is given here to prove it survives alongside the dataplaneapi one.
    haproxy_userlists:
      - name: test_userlist
        users:
          - name: testuser2
            insecure_password: secrete
            groups:
              - test_grp2
