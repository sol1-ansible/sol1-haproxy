# defaults file for haproxy
---

haproxy_dataplaneapi_enabled: false
haproxy_dataplaneapi_rebootstrap: false

default_haproxy_version: '3.2'
default_haproxy_config_dir: /etc/haproxy

default_dataplaneapi_version: '3.3.5'
default_dataplaneapi_config_dir: /etc/dataplaneapi

default_dataplaneapi_haproxy_userlist: dataplaneapi
default_dataplaneapi_haproxy_user: dataplaneapi
default_dataplaneapi_haproxy_password: ""

default_dataplaneapi_host: 127.0.0.1
default_dataplaneapi_port: 5555
default_dataplaneapi_scheme: [http]
default_dataplaneapi_haproxy_reload_delay: 5
default_dataplaneapi_log_target: stdout
default_dataplaneapi_log_level: info

# global section
haproxy_global_log:
  - address: /dev/log
    facility: local0
  - address: /dev/log
    facility: local1
    level: notice
haproxy_global_stats:
  sockets:
    - listen: "{{ _haproxy_stats_socket }}"
      param:
        - mode 660
        - level admin
  timeout: 30s
haproxy_global_user: haproxy
haproxy_global_group: haproxy
haproxy_global_daemon: true
haproxy_global_ca_base: /etc/ssl/certs
haproxy_global_crt_base: "{{ _haproxy_certs_dir }}"
haproxy_global_ssl_default_bind_ciphers: 'kEECDH+aRSA+AES:kRSA+AES:+AES256:RC4-SHA:!kEDH:!LOW:!EXP:!MD5:!aNULL:!eNULL'
haproxy_global_ssl_default_bind_ciphersuites: ''
haproxy_global_ssl_default_bind_options: 'no-sslv3'
haproxy_global_ssl_default_server_ciphers: 'kEECDH+aRSA+AES:kRSA+AES:+AES256:RC4-SHA:!kEDH:!LOW:!EXP:!MD5:!aNULL:!eNULL'
haproxy_global_ssl_default_server_ciphersuites: ''
haproxy_global_ssl_default_server_options: 'no-sslv3'
haproxy_global_option: []

# defaults section
haproxy_defaults_log: global
haproxy_defaults_mode: http
haproxy_defaults_option:
  - httplog
  - dontlognull
haproxy_defaults_timeout:
  - type: connect
    timeout: 5000
  - type: client
    timeout: 50000
  - type: server
    timeout: 50000
haproxy_defaults_errorfile:
  - code: 403
    file: "{{ _haproxy_errors_dir }}/403.http"
  - code: 503
    file: "{{ _haproxy_errors_dir }}/503.http"
  - code: 504
    file: "{{ _haproxy_errors_dir }}/504.http"
haproxy_defaults_server_params: []

# listen section
haproxy_listen: []

# front-end section
haproxy_frontend: []

# back-end section
haproxy_backend: []

# user-lists section
haproxy_userlists: []

# resolvers section:
haproxy_resolvers: []

# ACL files
haproxy_acl_files: []
