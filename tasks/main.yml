---
- name: haproxy.main | Load HAProxy variables
  ansible.builtin.include_vars: haproxy.yml

- name: haproxy.main | Load dataplaneapi variables if enabled
  when: haproxy_dataplaneapi_enabled
  ansible.builtin.include_vars: dataplaneapi.yml

- name: haproxy.main | Load OS-specific variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - files:
        - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
        - "{{ ansible_facts['distribution'] | lower }}.yml"
        - "{{ ansible_facts['os_family'] | lower }}.yml"
      skip: true

- name: haproxy.main | Import preflight task
  ansible.builtin.import_tasks: preflight.yml

- name: haproxy.main | Import install task
  when: _haproxy_install_required or _dataplaneapi_install_required or not _haproxy_cfg_managed_by_dpa
  ansible.builtin.import_tasks: install/install.yml

- name: haproxy.main | Import dataplaneapi config management task
  when: _haproxy_cfg_managed_by_dpa
  ansible.builtin.import_tasks: manage/manage_config.yml

- name: haproxy.main | Import dataplaneapi config sync task
  when: _haproxy_cfg_managed_by_dpa
  ansible.builtin.import_tasks: manage/sync_config.yml
