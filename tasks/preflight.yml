---
- name: haproxy.install.preflight | Install python helpers needed by the role on Debian/Ubuntu
  ansible.builtin.apt:
    name:
      - python3-apt
      - python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: haproxy.install.preflight | Check if the dataplaneapi marker file exists
  ansible.builtin.stat:
    path: "{{ _haproxy_config_dir }}/.dpa"
  register: _dpa_marker

- name: haproxy.install.preflight | Gather installed package facts
  ansible.builtin.package_facts:
    manager: auto

- name: haproxy.install.preflight | Work out what needs installing and who owns haproxy.cfg
  ansible.builtin.set_fact:
    _installed_haproxy_version: "{{ (ansible_facts.packages.haproxy | default([{}]))[0].version | default('') }}"
    _installed_dataplaneapi_version: "{{ (ansible_facts.packages.dataplaneapi | default([{}]))[0].version | default('') }}"
    
- name: haproxy.install.preflight | Work out what needs installing and who owns haproxy.cfg
  ansible.builtin.set_fact:
    _haproxy_install_required: "{{ not (_installed_haproxy_version is match('^' ~ (_haproxy_version | string | regex_escape) ~ '\\.')) }}"
    _dataplaneapi_install_required: "{{ haproxy_dataplaneapi_enabled and (_installed_dataplaneapi_version != (_dataplaneapi_version | default(''))) }}"
    _haproxy_cfg_managed_by_dpa: "{{ haproxy_dataplaneapi_enabled and _dpa_marker.stat.exists and not haproxy_dataplaneapi_rebootstrap }}"

- name: haproxy.install.preflight | Show what needs installing and who owns haproxy.cfg
  ansible.builtin.debug:
    msg:
      haproxy_install_required: "{{ _haproxy_install_required }}"
      dataplaneapi_install_required: "{{ _dataplaneapi_install_required }}"
      haproxy_cfg_managed_by_dataplaneapi: "{{ _haproxy_cfg_managed_by_dpa }}"

- name: haproxy.install.preflight | Check the dataplaneapi prerequisites
  when: haproxy_dataplaneapi_enabled
  ansible.builtin.assert:
    that:
      - _dataplaneapi_haproxy_password | length > 0
      - haproxy_global_stats is mapping
      - haproxy_global_stats.sockets | default([]) | length > 0
    fail_msg: >-
      dataplaneapi needs haproxy_dataplaneapi_password set and at least one stats socket in haproxy_global_stats
      (it is the runtime API, and the bootstrap haproxy.cfg has no other listener for 'haproxy -c' to accept)
