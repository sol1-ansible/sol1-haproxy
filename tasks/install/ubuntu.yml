- name: haproxy.install.ubuntu | Install the PPA for the HAProxy maintainer vbernat
  ansible.builtin.apt:
    name: software-properties-common
    update_cache: true

- name: haproxy.install.ubuntu | Enable the repo from the PPA for the HAProxy version
  ansible.builtin.apt_repository:
    repo: "ppa:vbernat/haproxy-{{ _haproxy_version }}"
    update_cache: true

- name: haproxy.install.ubuntu | Install HAProxy
  vars:
    haproxy_package: "haproxy={{ _haproxy_version }}.*"
  ansible.builtin.apt:
    update_cache: true
    name: "{{ haproxy_package }}"
    state: present
  notify: haproxy service
