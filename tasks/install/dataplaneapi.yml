- name: haproxy.install.dataplaneapi | Download dataplaneapi package
  ansible.builtin.get_url:
    url: "{{ _dataplaneapi_download_url }}"
    dest: "/tmp/{{ _dataplane_filename }}"
    mode: '0644'

- name: haproxy.install.dataplaneapi | Install dataplaneapi package (Debian family)
  when: ansible_facts['os_family'] == 'Debian'
  ansible.builtin.apt:
    deb: "/tmp/{{ _dataplane_filename }}"
    state: present
  notify: dataplaneapi service

- name: haproxy.install.dataplaneapi | Install dataplaneapi package (RedHat family)
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: "/tmp/{{ _dataplane_filename }}"
    state: present
    disable_gpg_check: true
  notify: dataplaneapi service
