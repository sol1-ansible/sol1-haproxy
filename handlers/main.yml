# handlers file for haproxy
---
- name: restart haproxy
  ansible.builtin.systemd:
    name: haproxy
    state: restarted

- name: restart dataplaneapi
  ansible.builtin.systemd:
    name: dataplaneapi
    state: restarted

- name: haproxy service
  ansible.builtin.systemd:
    name: haproxy
    enabled: true
    state: restarted

- name: dataplaneapi service
  ansible.builtin.systemd:
    name: dataplaneapi
    enabled: true
    state: restarted
